name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Detect changed areas
      id: filter
      shell: bash
      run: |
        set -eo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
        elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
          BASE="$(git rev-list --max-parents=0 HEAD)"
        else
          BASE="${{ github.event.before }}"
        fi

        backend=false
        ios=false

        if ! changed_files="$(git diff --name-only "$BASE" HEAD)"; then
          echo "Cannot diff against $BASE; running every job."
          changed_files=""
          backend=true
          ios=true
        else
          if grep -Eq '^(backend/PerfumeSoulBackend/|\.github/workflows/tests\.yml$)' <<< "$changed_files"; then
            backend=true
          fi

          if grep -Eq '^(PerfumeSoul/|PerfumeSoulTests/|PerfumeSoulUITests/|Models/|Tuist/|Project\.swift|\.swiftlint\.yml|\.github/workflows/tests\.yml$)' <<< "$changed_files"; then
            ios=true
          fi
        fi

        echo "$changed_files"

        {
          echo "backend=$backend"
          echo "ios=$ios"
        } >> "$GITHUB_OUTPUT"

  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/afoncom/perfume-soul-backend
      POSTGRES_PASSWORD: ci-password
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Prepare image tags
      id: image
      shell: bash
      run: |
        set -eo pipefail
        short_sha="${GITHUB_SHA::7}"

        {
          echo "short_sha=$short_sha"
          echo "tags<<EOF"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:$short_sha"
          echo "$IMAGE_NAME:$GITHUB_SHA"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v3
      if: github.event_name == 'push'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: backend/PerfumeSoulBackend
        platforms: linux/amd64
        load: true
        tags: ${{ steps.image.outputs.tags }}
    - name: Smoke check Docker Compose stack
      working-directory: backend/PerfumeSoulBackend
      env:
        BACKEND_IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
      run: |
        set -eo pipefail
        docker compose up -d --wait --wait-timeout 180
        curl -f http://127.0.0.1:8080/health
        curl -f http://127.0.0.1:8080/ready
        curl -f http://127.0.0.1:8080/quiz-of-the-day
        code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/perfumes/1/notes)"
        echo "/perfumes/1/notes -> $code"
        [[ "$code" == "404" || "$code" == "200" ]]
    - name: Dump Compose logs
      if: failure()
      working-directory: backend/PerfumeSoulBackend
      env:
        BACKEND_IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
      run: docker compose logs --no-color --timestamps
    - name: Stop Docker Compose stack
      if: always()
      working-directory: backend/PerfumeSoulBackend
      env:
        BACKEND_IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
      run: docker compose down -v
    - name: Push backend Docker image
      if: github.event_name == 'push'
      run: |
        set -eo pipefail
        docker push "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:${{ steps.image.outputs.short_sha }}"
        docker push "$IMAGE_NAME:$GITHUB_SHA"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
    - uses: actions/checkout@v5
    - name: Cache backend SwiftPM build
      uses: actions/cache@v4
      with:
        path: backend/PerfumeSoulBackend/.build
        key: linux-backend-spm-${{ hashFiles('backend/PerfumeSoulBackend/Package.resolved') }}
    - name: Run backend tests
      working-directory: backend/PerfumeSoulBackend
      run: swift test

  test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - uses: actions/checkout@v5
    - uses: jdx/mise-action@v4
      with:
        tool_versions: |
          tuist latest
    - name: Generate Xcode project
      shell: bash
      run: |
        set -eo pipefail
        if [[ -f "PerfumeSoul.xcodeproj/project.pbxproj" ]]; then
          echo "PerfumeSoul.xcodeproj already exists."
          exit 0
        fi

        echo "PerfumeSoul.xcodeproj is missing. Generating from Project.swift..."
        tuist version
        tuist generate --no-open
    - name: Run tests
      shell: bash
      run: |
        set -eo pipefail
        SIMULATOR_ID=$(xcrun simctl list devices available | sed -nE '/iPhone/ s/.*\(([0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12})\).*/\1/p' | tail -n 1)
        if [[ -z "$SIMULATOR_ID" ]]; then
          echo "No available iPhone simulator found."
          xcrun simctl list devices available
          exit 1
        fi

        xcodebuild test \
          -project PerfumeSoul.xcodeproj \
          -scheme PerfumeSoul \
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
          -enableCodeCoverage YES \
          | tee xcodebuild.log
    - name: Upload logs if failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-log
        path: xcodebuild.log
