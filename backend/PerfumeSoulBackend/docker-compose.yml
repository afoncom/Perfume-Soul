services:
  postgres:
    image: postgres:18
    container_name: perfumesoul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: perfumesoul
      POSTGRES_USER: perfumesoul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumesoul -d perfumesoul"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfumesoul-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://perfumesoul:${POSTGRES_PASSWORD}@postgres:5432/perfumesoul
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
