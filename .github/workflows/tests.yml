name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Detect changed areas
      id: filter
      shell: bash
      run: |
        set -eo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
        elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
          BASE="$(git rev-list --max-parents=0 HEAD)"
        else
          BASE="${{ github.event.before }}"
        fi

        backend=false
        ios=false

        if ! changed_files="$(git diff --name-only "$BASE" HEAD)"; then
          echo "Cannot diff against $BASE; running every job."
          changed_files=""
          backend=true
          ios=true
        else
          if grep -Eq '^(backend/PerfumeSoulBackend/|\.github/workflows/tests\.yml$)' <<< "$changed_files"; then
            backend=true
          fi

          if grep -Eq '^(PerfumeSoul/|PerfumeSoulTests/|PerfumeSoulUITests/|Models/|Tuist/|Project\.swift|\.swiftlint\.yml|\.github/workflows/tests\.yml$)' <<< "$changed_files"; then
            ios=true
          fi
        fi

        echo "$changed_files"

        {
          echo "backend=$backend"
          echo "ios=$ios"
        } >> "$GITHUB_OUTPUT"

  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/afoncom/perfume-soul-backend
      POSTGRES_PASSWORD: ci-password
      COMPOSE_FILE: docker-compose.yml
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Prepare image tags
      id: image
      shell: bash
      run: |
        set -eo pipefail
        short_sha="${GITHUB_SHA::7}"

        {
          echo "short_sha=$short_sha"
          echo "tags<<EOF"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:$short_sha"
          echo "$IMAGE_NAME:$GITHUB_SHA"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v3
      if: github.event_name == 'push'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: backend/PerfumeSoulBackend
        platforms: linux/amd64
        load: true
        tags: ${{ steps.image.outputs.tags }}
        cache-from: type=gha
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
    - name: Smoke check Docker Compose stack
      working-directory: backend/PerfumeSoulBackend
      env:
        BACKEND_IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
      run: |
        set -eo pipefail
        docker compose up -d --wait --wait-timeout 180
        curl -f http://127.0.0.1:8080/health
        curl -f http://127.0.0.1:8080/ready
        legacy_horoscope_code="$(curl -fsS -o legacy-horoscopes.json -w '%{http_code}' \
          http://127.0.0.1:8080/horoscope/daily)"
        [[ "$legacy_horoscope_code" == "200" ]]
        jq -e '
          type == "array" and length == 12
          and ([.[].sign] | sort) == [
            "aquarius", "aries", "cancer", "capricorn", "gemini", "leo",
            "libra", "pisces", "sagittarius", "scorpio", "taurus", "virgo"
          ]
          and all(.[];
            (.sign | type) == "string"
            and (.energyOfDay | type) == "string"
            and (.energyOfDay | length) > 0
          )
        ' legacy-horoscopes.json
        legacy_history_code="$(curl -fsS -o legacy-perfumery-history.json -w '%{http_code}' \
          http://127.0.0.1:8080/perfumery-history)"
        [[ "$legacy_history_code" == "200" ]]
        jq -e '
          (.year | type) == "number"
          and (.perfumeName | type) == "string"
          and (.perfumeName | length) > 0
          and (.shortStory | type) == "string"
          and (.shortStory | length) > 0
          and (.fullStory | type) == "string"
          and (.fullStory | length) > 0
          and (.imageUrl | type) == "string"
        ' legacy-perfumery-history.json
        curl -f http://127.0.0.1:8080/quiz-of-the-day
        curl -fsS -H 'Accept-Language: ru' \
          'http://127.0.0.1:8080/v3/quiz-of-the-day?dayKey=2026-12-01' > quiz-ru.json
        curl -fsS -H 'Accept-Language: en' \
          'http://127.0.0.1:8080/v3/quiz-of-the-day?dayKey=2026-12-01' > quiz-en.json
        jq -e 'type == "array" and length == 15' quiz-ru.json
        diff <(jq '[.[].id]' quiz-ru.json) <(jq '[.[].id]' quiz-en.json)
        docker compose exec -T postgres \
          psql -U perfumesoul -d perfumesoul -v ON_ERROR_STOP=1 --single-transaction < scripts/seed_similar_finder_smoke.sql
        curl -fsS \
          -H 'Accept-Language: en-US' \
          'http://127.0.0.1:8080/perfumes/recommendations?perfumeIDs=91001' \
          -o similar-finder.json
        jq -e '
          any(.[]; .id == 93001 and .matchingNotes == ["Bergamot"])
          and all(.[]; .id != 93002)
        ' similar-finder.json
        curl -fsS -X POST \
          -H 'Content-Type: application/json' \
          --data '{"sun":"leo","moon":"cancer","ascendant":"scorpio","elementBalance":{"fire":45,"earth":15,"air":10,"water":30}}' \
          http://127.0.0.1:8080/personal-perfumes \
          -o personal-perfumes.json
        jq -e 'any(.[]; .id == 93001 and .marketSegment == "daily")' personal-perfumes.json
        docker compose exec -T postgres \
          psql -U perfumesoul -d perfumesoul -v ON_ERROR_STOP=1 --single-transaction < scripts/seed_catalog_segmentation_smoke.sql
        docker compose exec -T postgres \
          psql -U perfumesoul -d perfumesoul -v ON_ERROR_STOP=1 --single-transaction < scripts/classify_curated_catalog_segments.sql
        segmented_count="$(docker compose exec -T postgres \
          psql -U perfumesoul -d perfumesoul -At -c "
            SELECT COUNT(*)
            FROM perfumes AS perfume
            JOIN brands AS brand ON brand.id = perfume.brand_id
            WHERE (lower(btrim(brand.brand)), perfume.market_segment) IN (
              ('chanel', 'luxury'),
              ('creed', 'niche'),
              ('zara', 'daily')
            )
          ")"
        [[ "$segmented_count" == "3" ]]
        code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/perfumes/1/notes)"
        echo "/perfumes/1/notes -> $code"
        [[ "$code" == "404" || "$code" == "200" ]]
        horoscope_count="$(docker compose exec -T postgres \
          psql -U perfumesoul -d perfumesoul -At -c 'SELECT COUNT(*) FROM daily_horoscope_entries')"
        [[ "$horoscope_count" == "8772" ]]
        horoscope_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          'http://127.0.0.1:8080/horoscope/daily?timeZone=UTC')"
        echo "/horoscope/daily → $horoscope_code"
        [[ "$horoscope_code" == "200" || "$horoscope_code" == "404" ]]
        history_count="$(docker compose exec -T postgres \
          psql -U perfumesoul -d perfumesoul -At -c 'SELECT COUNT(*) FROM perfumery_history_entries')"
        [[ "$history_count" == "731" ]]
        history_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          'http://127.0.0.1:8080/v2/perfumery-history?timeZone=UTC')"
        echo "/v2/perfumery-history → $history_code"
        [[ "$history_code" == "200" || "$history_code" == "404" ]]
    - name: Dump Compose logs
      if: failure()
      working-directory: backend/PerfumeSoulBackend
      env:
        BACKEND_IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
      run: docker compose logs --no-color --timestamps
    - name: Stop Docker Compose stack
      if: always()
      working-directory: backend/PerfumeSoulBackend
      env:
        BACKEND_IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
      run: docker compose down -v
    - name: Push backend Docker image
      if: github.event_name == 'push'
      run: |
        set -eo pipefail
        docker push "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:${{ steps.image.outputs.short_sha }}"
        docker push "$IMAGE_NAME:$GITHUB_SHA"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: perfumesoul_test
          POSTGRES_USER: perfumesoul_test
          POSTGRES_PASSWORD: perfumesoul_test
        options: >-
          --health-cmd "pg_isready -U perfumesoul_test -d perfumesoul_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v5
    - name: Capture Swift toolchain version
      run: swift --version > backend-swift-version.txt
    - name: Cache backend SwiftPM build
      uses: actions/cache@v4
      with:
        path: backend/PerfumeSoulBackend/.build
        key: linux-backend-spm-${{ hashFiles('backend-swift-version.txt') }}-${{ hashFiles('backend/PerfumeSoulBackend/Package.resolved') }}
        restore-keys: |
          linux-backend-spm-${{ hashFiles('backend-swift-version.txt') }}-
    - name: Run backend tests
      working-directory: backend/PerfumeSoulBackend
      env:
        PERFUME_SOUL_TEST_DATABASE_URL: postgresql://perfumesoul_test:perfumesoul_test@postgres:5432/perfumesoul_test
      run: swift test

  test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - uses: actions/checkout@v5
    - uses: jdx/mise-action@v4
      with:
        tool_versions: |
          tuist latest
    - name: Generate Xcode project
      shell: bash
      run: |
        set -eo pipefail
        if [[ -f "PerfumeSoul.xcodeproj/project.pbxproj" ]]; then
          echo "PerfumeSoul.xcodeproj already exists."
          exit 0
        fi

        echo "PerfumeSoul.xcodeproj is missing. Generating from Project.swift..."
        tuist version
        tuist generate --no-open
    - name: Run tests
      shell: bash
      run: |
        set -eo pipefail
        SIMULATOR_ID=$(xcrun simctl list devices available | sed -nE '/iPhone/ s/.*\(([0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12})\).*/\1/p' | tail -n 1)
        if [[ -z "$SIMULATOR_ID" ]]; then
          echo "No available iPhone simulator found."
          xcrun simctl list devices available
          exit 1
        fi

        xcodebuild test \
          -project PerfumeSoul.xcodeproj \
          -scheme PerfumeSoul \
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
          -enableCodeCoverage YES \
          | tee xcodebuild.log
    - name: Upload logs if failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-log
        path: xcodebuild.log
