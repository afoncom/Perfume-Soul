services:
  postgres:
    image: postgres:18
    container_name: perfumesoul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: perfumesoul
      POSTGRES_USER: perfumesoul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumesoul -d perfumesoul"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/afoncom/perfume-soul-backend:latest
    container_name: perfumesoul-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://perfumesoul:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/perfumesoul
      VAPOR_ENV: production
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
